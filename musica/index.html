<!DOCTYPE html>

<style>
/* La misma piel del afinador: tinta y papel, canto duro, un acento. Cero
   notacion en toda la pantalla — es la regla 1 del proyecto. */
:root{
  --papel:#eceff5; --tinta:#0a0c12; --tenue:#5a6377; --linea:#c8cedb;
  --acento:#1c3bf0; --bien:#0a6b45; --mal:#c1121f; --tibio:#8a5a00; --panel:#fff;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--sans);
  min-height:100vh;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}

.barra{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px clamp(16px,4vw,32px);border-bottom:1px solid var(--linea);background:var(--panel)}
.marca{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.marca b{color:var(--acento);font-weight:700}
.barra nav{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:10px;
  letter-spacing:.18em;text-transform:uppercase}
.barra nav a{color:var(--tenue);text-decoration:none;border-bottom:1px solid transparent}
.barra nav a:hover{color:var(--acento);border-color:var(--acento)}

main{flex:1;display:flex;flex-direction:column}
#pantalla{flex:1;padding:clamp(20px,4vw,40px) clamp(16px,4vw,32px);max-width:1080px;width:100%;margin:0 auto}

h1{font-size:clamp(26px,4.5vw,40px);letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:26px}

.tarjetas{display:grid;gap:1px;background:var(--linea);border:1px solid var(--linea)}
.tarjeta{background:var(--panel);padding:16px 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tarjeta .rotulo{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--acento);min-width:110px}
.tarjeta b{font-size:15px;font-weight:700}
.tarjeta .det{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--tenue)}
.tarjeta .listo{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--bien)}

.acciones{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  padding:14px 26px;border:1px solid var(--tinta);background:var(--tinta);color:var(--papel);
  cursor:pointer;border-radius:0}
.btn:hover{background:var(--acento);border-color:var(--acento)}
.btn.plano{background:transparent;color:var(--tinta)}
.btn.plano:hover{color:var(--acento);border-color:var(--acento);background:transparent}
.btn[disabled]{opacity:.35;cursor:default}
.btn.chico{padding:8px 14px;font-size:10px}

.nota-mini{margin-top:22px;font-family:var(--mono);font-size:11px;line-height:1.9;
  color:var(--tenue);max-width:74ch}
.nota-mini b{color:var(--tinta)}

/* pantalla de ejercicio */
.ej-cab{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.ej-cab .paso{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--acento)}
.dice{font-size:clamp(16px,2.4vw,21px);line-height:1.6;max-width:60ch;margin:14px 0 22px}
.tempo-linea{position:relative;height:4px;background:var(--linea);margin:8px 0 26px}
.tempo-linea i{position:absolute;left:0;top:0;bottom:0;background:var(--acento);width:0}

.gigante{font-size:clamp(56px,13vw,120px);line-height:.95;font-weight:600;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;min-height:.98em}
.gigante small{font-size:.32em;font-weight:400;color:var(--tenue);letter-spacing:0}
.gigante.bien{color:var(--bien)}
.gigante.mal{color:var(--mal)}

.pulso{width:26px;height:26px;background:var(--linea);display:inline-block;vertical-align:middle}
.pulso.va{background:var(--acento)}

.metricas{display:flex;gap:1px;background:var(--linea);border:1px solid var(--linea);
  margin-top:26px;flex-wrap:wrap}
.metricas div{background:var(--panel);padding:10px 16px;flex:1;min-width:130px}
.metricas span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--tenue);margin-bottom:4px}
.metricas b{font-family:var(--mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}

.opciones{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.opciones .btn{min-width:170px;text-align:center}
.tecla{display:inline-block;border:1px solid var(--linea);padding:1px 7px;margin-right:8px;
  font-family:var(--mono);font-size:11px;background:var(--papel);color:var(--tinta)}

/* veredicto */
.veredicto-caja{border:1px solid var(--linea);background:var(--panel);padding:34px;
  margin-top:10px;text-align:center}
.veredicto-caja .sello{display:inline-block;font-family:var(--mono);font-size:13px;
  letter-spacing:.3em;text-transform:uppercase;padding:10px 22px;margin-top:18px;border:1px solid}
.sello.si{color:#fff;background:var(--bien);border-color:var(--bien)}
.sello.no{color:var(--tibio);border-color:var(--tibio)}
.veredicto-caja .contra{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  color:var(--tenue);margin-top:12px}

table.resumen{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:8px}
table.resumen th{text-align:left;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--tenue);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--linea)}
table.resumen td{padding:10px;border-bottom:1px solid var(--linea)}
td.si{color:var(--bien);font-weight:700} td.no{color:var(--tibio)}

/* pie de diagnostico, siempre a la vista: la sesion es una herramienta */
#pie{display:flex;gap:1px;background:var(--linea);border-top:1px solid var(--linea);
  font-family:var(--mono)}
#pie div{background:var(--panel);padding:8px 14px;flex:1;min-width:110px}
#pie span{display:block;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--tenue)}
#pie b{font-size:11px;font-weight:400;font-variant-numeric:tabular-nums}
#pie b.mal{color:var(--mal);font-weight:700}
.nivelito{height:4px;background:var(--linea);margin-top:4px;overflow:hidden}
.nivelito i{display:block;height:100%;width:0;background:var(--acento)}

#aviso{padding:12px clamp(16px,4vw,32px);font-family:var(--mono);font-size:12px;line-height:1.7;
  background:#fff5f5;color:var(--mal);border-bottom:1px solid var(--linea);display:none}
#aviso.on{display:block}
#aviso.tibio{background:#fffbe8;color:var(--tibio)}

@media(max-width:640px){ .tarjeta .listo{margin-left:0;width:100%} }
</style>
</head>
<body>

<header class="barra">
  <span class="marca">el profesor <b>//</b> nerv</span>
  <nav>
    <a href="afinador">afinador</a>
    <a href="entradas">entradas</a>
  </nav>
</header>
<p id="aviso"></p>

<main>
  <div id="pantalla"></div>
</main>

<footer id="pie">
  <div><span>entrada</span><b id="pEntrada">—</b></div>
  <div><span>nivel</span><b id="pNivel">—</b><div class="nivelito"><i id="pBarra"></i></div></div>
  <div><span>nota</span><b id="pNota">—</b></div>
  <div><span>lecturas/s</span><b id="pLps">—</b></div>
  <div><span>desfase calibrado</span><b id="pCal">—</b></div>
</footer>

<script type="module">
import {
  N, RUIDO, BLOQUE, medir, crearDetectorDeAtaques,
  FUENTE_WORKLET, pedirEntrada, conectarCadena,
  NOMBRES, CUERDA_HZ, midiDeHz, hzDeMidi, nombreDeMidi, centsEntre,
  listarEntradas, recordarEntrada, entradaRecordada
} from './oido.js';
import {
  elegirSesion, registrar, marcarSabido, cerrarSesion,
  bitacoraVacia, bpmPara, desbloqueado, MEDIDAS_LISTAS
} from './plan.js';

'use strict';
const $ = (s) => document.querySelector(s);
const pantalla = $('#pantalla');
const p2 = (n) => String(n).padStart(2, '0');
const hoy = () => {
  const d = new Date();
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
};

/* Azar reproducible: la MISMA sesion del MISMO dia hace las mismas preguntas.
   Sin esto no hay forma de comparar dos intentos ni de reproducir un reporte. */
function rngDe(semillaTxt) {
  let h = 2166136261;
  for (let i = 0; i < semillaTxt.length; i++) { h ^= semillaTxt.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () {
    h |= 0; h = (h + 0x6D2B79F5) | 0;
    let t = Math.imul(h ^ (h >>> 15), 1 | h);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const centsA = centsEntre;

/* Una nota al azar dentro de la ficha (cuerdas + rango de trastes). Compartida
   por igualar y encontrar; era la misma linea copiada dos veces. */
function notaAlAzar(e, rng) {
  const c = e.ficha.cuerdas[Math.floor(rng() * e.ficha.cuerdas.length)];
  const t = e.ficha.trastes[0] + Math.floor(rng() * (e.ficha.trastes[1] - e.ficha.trastes[0] + 1));
  const hz = CUERDA_HZ[c] * Math.pow(2, t / 12);
  return { hz, nombre: nombreDeMidi(midiDeHz(hz)) };
}

/* ── bitacora ─────────────────────────────────────────────────────────── */
const LLAVE = 'profesor-bitacora';
function cargarBit() {
  try {
    const b = JSON.parse(localStorage.getItem(LLAVE));
    if (b && b.aprobados) return b;
  } catch (e) {}
  return bitacoraVacia();
}
function guardarBit(b) { try { localStorage.setItem(LLAVE, JSON.stringify(b)); } catch (e) {} }
let bit = cargarBit();

/* ── catalogo ─────────────────────────────────────────────────────────── */
let CAT = null;
try {
  CAT = await (await fetch('catalogo.json')).json();
} catch (e) {
  pantalla.innerHTML = '<h1>No cargó el catálogo</h1><p class="dice">Sin ' +
    '<code>catalogo.json</code> no hay qué proponer. ¿Está servida la carpeta completa?</p>';
  throw e;
}
const POR_ID = new Map(CAT.ejercicios.map((e) => [e.id, e]));

/* ── audio: un solo contexto para oir y para sonar ─────────────────────── */
let ctx = null, flujo = null, nodo = null, cadena = null;
let nivel = 0, maxNivel = 0, canal = 0, lecturas = 0, notaViva = 0;
let alVentana = null;         // el corredor de turno se cuelga aqui
let detector = null;
let arrancando = false;       // candado: dos Escuchar a la vez = dos motores
let quiereAltura = true;      // el quiz y el jam no leen altura: YIN se apaga
let avisoPegajoso = false;    // un aviso pegajoso no se borra al cambiar pantalla

/* Cada pantalla vive en una EPOCA. Un temporizador que despierta en una epoca
   que ya no es la suya se calla y muere: es lo que impide que el setTimeout de
   una ronda pinte encima del veredicto, o que el barraTiempo de un ejercicio
   abandonado mate al siguiente. */
let epoca = 0;
function vigente(fn) {
  const e = epoca;
  return function () { if (e === epoca) fn.apply(null, arguments); };
}

/* La limpieza del corredor de turno (metronomo, timers). `correr` la dispara
   antes de arrancar el siguiente, por si el anterior no cerro solo. */
let limpiar = null;
function armar(fn) { limpiar = fn; }
function desmontar() {
  if (!limpiar) return;
  const l = limpiar; limpiar = null;
  try { l(); } catch (e) {}
}

function avisar(msg, tibio, pegajoso) {
  const a = $('#aviso');
  if (!msg) {
    // Un aviso pegajoso (los filtros de videollamada encendidos) NO se borra
    // al cambiar de pantalla: si se borrara, la sesion entera mediria con el
    // compresor puesto y nadie se enteraria.
    if (avisoPegajoso) return;
    a.className = ''; return;
  }
  avisoPegajoso = !!pegajoso;
  a.innerHTML = msg; a.className = 'on' + (tibio ? ' tibio' : '');
}

function soltarMicrofono() {
  // El fin de la sesion apaga el indicador rojo y deja de quemar YIN en vano.
  if (nodo) { try { nodo.port.onmessage = null; nodo.disconnect(); } catch (e) {} nodo = null; }
  if (cadena) { cadena.desconectar(); cadena = null; }
  if (flujo) { flujo.getTracks().forEach((t) => t.stop()); flujo = null; }
  if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {});
  nivel = 0; notaViva = 0;
}

async function abrirOido(deviceId) {
  /* El candado y el desmontaje completo son el bug ya pagado en el afinador:
     dos llamadas a la vez, o una segunda sin tirar el grafo de la primera,
     dejan dos motores posteando y las ventanas muertas del viejo (f=0)
     resetean las rachas de los ejercicios. */
  if (arrancando) return;
  arrancando = true;
  try {
    soltarMicrofono();
    avisoPegajoso = false; avisar('');
    flujo = await pedirEntrada(deviceId);
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const url = URL.createObjectURL(new Blob([FUENTE_WORKLET], { type: 'text/javascript' }));
      try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
    }
    if (ctx.state === 'suspended') await ctx.resume();
    nodo = new AudioWorkletNode(ctx, 'acarreo', { processorOptions: { N: N } });
    cadena = conectarCadena(ctx, flujo, nodo);
    detector = crearDetectorDeAtaques(ctx.sampleRate);
    maxNivel = 0;

    const pista = flujo.getAudioTracks()[0];
    const aj = pista.getSettings ? pista.getSettings() : {};
    $('#pEntrada').textContent = pista.label || '—';
    // Se recuerda lo ENTREGADO, no lo pedido: si el navegador dio otra cosa,
    // el desplegable debe decirlo, no sostener la mentira.
    recordarEntrada(aj.deviceId || deviceId);
    if (aj.echoCancellation || aj.noiseSuppression || aj.autoGainControl) {
      avisar('<b>El navegador dejó encendido un filtro de videollamada</b> y los números ' +
        'de esta sesión no van a valer. Revisa la entrada en <a href="afinador">el afinador</a>.',
        true, true);
    }

    nodo.port.onmessage = (ev) => {
      const ca = ev.data.a, cb = ev.data.b, t0 = ev.data.t0;
      lecturas++;

      /* UNA pasada por los datos: suma para el RMS y pico por bloque para el
         detector, a la vez. Antes eran tres pasadas por los mismos 4096. */
      let sa = 0, sb = 0;
      let ataques = null;
      for (let b = 0; b < N / BLOQUE; b++) {
        let pico = 0;
        for (let k = b * BLOQUE; k < (b + 1) * BLOQUE; k++) {
          const va = ca[k], vb = cb[k];
          sa += va * va; sb += vb * vb;
          const v = Math.max(va < 0 ? -va : va, vb < 0 ? -vb : vb);
          if (v > pico) pico = v;
        }
        const t = detector(pico, t0 + b * BLOQUE / ctx.sampleRate);
        if (t !== null) (ataques || (ataques = [])).push(t);
      }
      const ra = Math.sqrt(sa / N), rb = Math.sqrt(sb / N);
      nivel = Math.max(ra, rb);
      if (nivel > maxNivel) maxNivel = nivel;
      canal = ra >= rb ? 1 : 2;

      /* YIN cuesta ~737 mil operaciones: solo corre cuando el corredor de
         turno lee altura. El quiz y el jam no la leen, y quemarla ahi era
         compartir el hilo con los osciladores para tirar el resultado. */
      let f = 0;
      if (quiereAltura && nivel >= RUIDO) {
        f = medir(ra >= rb ? ca : cb, ctx.sampleRate);
        if (!f && Math.min(ra, rb) >= RUIDO) f = medir(ra >= rb ? cb : ca, ctx.sampleRate);
      }
      notaViva = f;
      if (alVentana) alVentana({ f, nivel, ataques: ataques || [], t0 });
    };
  } finally { arrancando = false; }
}

/* pie de diagnostico */
setInterval(() => {
  $('#pLps').textContent = lecturas ? lecturas + ' /s' : '—';
  lecturas = 0;
  $('#pNivel').textContent = (nivel > 0 ? (20 * Math.log10(nivel)).toFixed(1) : '−∞') +
    (maxNivel > 0 ? ' · máx ' + (20 * Math.log10(maxNivel)).toFixed(1) : '') +
    (canal ? ' · c' + canal : '');
  $('#pBarra').style.width = Math.min(100, nivel * 900) + '%';
  $('#pNota').textContent = !quiereAltura ? '·' : (notaViva ? nombreDeMidi(midiDeHz(notaViva)) : '—');
  $('#pCal').textContent = bit.calibracion ? bit.calibracion.offset.toFixed(0) + ' ms' : 'sin calibrar';
}, 500);

/* ── sonidos que la sesion produce ────────────────────────────────────── */
function clic(t, acento) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square'; o.frequency.value = acento ? 1568 : 1046;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(acento ? 0.14 : 0.09, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.06);
}
function tono(hz, t, dur, gan) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gan || 0.12, t + 0.03);
  g.gain.setValueAtTime(gan || 0.12, t + dur - 0.08);
  g.gain.linearRampToValueAtTime(0, t + dur);
  const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = hz;
  const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = hz;
  const g2 = ctx.createGain(); g2.gain.value = 0.4;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(ctx.destination);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}

/* el metronomo: agenda clics por delante y devuelve la lista de tiempos */
function crearMetronomo(bpm, compas) {
  const paso = 60 / bpm;
  const clics = [];
  let siguiente = ctx.currentTime + 0.35, n = 0, vivo = true;
  const timer = setInterval(() => {
    if (!vivo) return;
    while (siguiente < ctx.currentTime + 0.35) {
      const acento = compas ? (n % compas === 0) : false;
      clic(siguiente, acento);
      clics.push(siguiente);
      // Los clics viejos ya no pueden ser el mas cercano a nada: se podan,
      // que si no la busqueda crece con la duracion del ejercicio.
      if (clics.length > 48) clics.shift();
      siguiente += paso; n++;
    }
  }, 100);
  return {
    clics, paso,
    parar() { vivo = false; clearInterval(timer); }
  };
}

/* ── pantallas ────────────────────────────────────────────────────────── */
let sesion = null;
let resultados = [];
let cola = [];               // ejercicios pendientes de la sesion
let pasoN = 0, pasoTotal = 0;
let modoSuelto = null;       // ?ej=<id>: un solo ejercicio, sin bitacora de sesion

function teclas(mapa) {
  document.onkeydown = (e) => {
    const f = mapa[e.key === ' ' ? 'espacio' : e.key.toLowerCase()];
    if (f) { e.preventDefault(); f(); }
  };
}

function pantallaPlan() {
  epoca++; desmontar();
  document.onkeydown = null;
  sesion = elegirSesion(CAT, bit, hoy());
  // La cola se arma AQUI y no solo al arrancar: "proponme otro bloque"
  // cambia la sesion, y una cola vieja correria los ejercicios del plan
  // que el usuario acaba de rechazar.
  cola = sesion.calentamiento.concat(sesion.dia, sesion.jam ? [sesion.jam] : []);
  pasoTotal = cola.length;
  pasoN = 0;
  resultados = [];
  const filas = [];
  const tarjeta = (rotulo, e, extra) =>
    '<div class="tarjeta"><span class="rotulo">' + rotulo + '</span>' +
    '<b>' + e.nombre + '</b><span class="det">' + Math.round(e.duracion_s / 60 * 10) / 10 +
    ' min · ' + e.bloque + (bpmPara(bit, e) ? ' · ' + bpmPara(bit, e) + ' bpm' : '') + '</span>' +
    (extra || '') + '</div>';

  sesion.calentamiento.forEach((e, i) => filas.push(tarjeta(i === 0 ? 'calentamiento' : '', e)));
  sesion.dia.forEach((e, i) => filas.push(tarjeta(i === 0 ? 'el trabajo de hoy' : '', e)));
  if (sesion.jam) filas.push(tarjeta('el cierre', sesion.jam,
    '<span class="listo">jam en ' + sesion.tonalidad + ' · no se mide</span>'));

  let sinMotor = '';
  if (sesion.sinMotor.length) {
    sinMotor = '<p class="nota-mini"><b>Aún sin motor de medición</b> (piden oído de acordes, ' +
      'que es el nivel 3). Si alguno ya lo dominas, márcalo y se abre lo que depende de él:</p>' +
      '<div class="acciones">' + sesion.sinMotor.map((e) =>
        '<button class="btn plano chico" data-sabido="' + e.id + '">' + e.nombre + ' · ya lo sé</button>'
      ).join('') + '</div>';
  }

  pantalla.innerHTML =
    '<h1>La sesión de hoy</h1>' +
    '<p class="sub">' + hoy() + ' · ' + (sesion.calentamiento.length + sesion.dia.length) +
    ' ejercicios + jam · ~12 min · bloque: ' + (sesion.bloque || '—') + '</p>' +
    '<div class="tarjetas">' + filas.join('') + '</div>' +
    '<div class="acciones">' +
    '<button class="btn" id="empezar">Empezar</button>' +
    (sesion.bloque ? '<button class="btn plano" id="otro">Proponme otro bloque</button>' : '') +
    '</div>' + sinMotor;

  $('#empezar').onclick = pantallaEntrada;
  const otro = $('#otro');
  if (otro) otro.onclick = () => {
    bit = { ...bit, ultimoBloqueDia: sesion.bloque };
    pantallaPlan();
  };
  pantalla.querySelectorAll('[data-sabido]').forEach((b) => {
    b.onclick = () => { bit = marcarSabido(bit, b.dataset.sabido, hoy()); guardarBit(bit); pantallaPlan(); };
  });
  teclas({ espacio: pantallaEntrada });
}

async function pantallaEntrada() {
  epoca++; desmontar();
  quiereAltura = true;
  avisar('');
  const recordada = entradaRecordada();
  pantalla.innerHTML =
    '<h1>El oído</h1><p class="sub">la misma entrada que el afinador</p>' +
    '<div class="acciones"><select id="disp" style="font-family:var(--mono);font-size:11px;' +
    'padding:10px;border:1px solid var(--linea);background:var(--panel);max-width:340px">' +
    '<option>— pide permiso primero —</option></select>' +
    '<button class="btn" id="oir">Escuchar</button></div>' +
    '<p class="dice" id="check">Toca una cuerda, la que sea. Cuando el oído la lea, seguimos.</p>' +
    '<div class="gigante" id="leida">—</div>' +
    '<div class="acciones"><button class="btn" id="seguir" disabled>Continuar</button></div>';

  await listarEntradas($('#disp'), recordada);

  let seguidas = 0;
  $('#oir').onclick = async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return avisar('Este navegador no da acceso al micrófono.');
    }
    if (!window.isSecureContext) {
      return avisar('<b>Contexto inseguro.</b> El micrófono sólo se abre por <b>https</b> o ' +
        'desde <b>localhost</b> — abierto como archivo suelto, el navegador lo niega siempre.');
    }
    try {
      await abrirOido($('#disp').value);
      await listarEntradas($('#disp'), entradaRecordada());
      seguidas = 0;
      alVentana = (v) => {
        if (v.f) {
          $('#leida').textContent = nombreDeMidi(midiDeHz(v.f));
          if (++seguidas >= 3) { $('#seguir').disabled = false; $('#check').textContent = 'Ahí está. Vamos.'; }
        }
      };
    } catch (e) {
      avisar('<b>No se pudo abrir la entrada.</b> ' + (e && e.name ? e.name : '') +
        ' — ¿otro programa la tiene tomada? Prueba en <a href="entradas">entradas</a>.');
    }
  };
  $('#seguir').onclick = () => {
    alVentana = null;
    const necesitaCal = (modoSuelto ? [modoSuelto] : cola)
      .some((e) => e.mide === 'desviacion_ms');
    const vieja = !bit.calibracion ||
      (Date.now() - new Date(bit.calibracion.fecha).getTime()) > 7 * 86400e3;
    if (necesitaCal && vieja) pantallaCalibrar();
    else siguienteEjercicio();
  };
  teclas({});
}

/* La calibracion absorbe TODO el desfase del sistema — entrada, buffers,
   salida — que de otro modo se cobraria en cada ejercicio de ritmo como si
   fuera culpa del guitarrista. Obligatoria y renovable cada 7 dias. */
function pantallaCalibrar() {
  epoca++; desmontar();
  quiereAltura = false;
  teclas({});
  const OBJETIVO = 10;
  pantalla.innerHTML =
    '<h1>Calibrar el reloj</h1>' +
    '<p class="sub">una vez por semana, o cuando cambie la interfaz</p>' +
    '<p class="dice">Van a sonar clics. <b>Toca una nota corta y apagada exactamente ' +
    'con cada clic</b> — no importa cuál. Esto mide el retraso del sistema para ' +
    'restarlo después; sin esto, los ejercicios de ritmo miden a la máquina y no a ti.</p>' +
    '<div class="gigante" id="cuenta">' + OBJETIVO + '</div>' +
    '<div class="metricas"><div><span>desfase medido</span><b id="dMed">—</b></div>' +
    '<div><span>estabilidad</span><b id="dEst">—</b></div></div>';

  const met = crearMetronomo(75, 0);
  const crudos = [];
  armar(() => { met.parar(); alVentana = null; });

  /* La calibracion era la unica pantalla sin salida: si los golpes no llegan
     (ganancia baja, entrada equivocada), el metronomo clicaba para siempre y
     la unica puerta era recargar. A los 45 segundos se rinde y lo dice. */
  const rendirse = setTimeout(vigente(() => {
    desmontar();
    avisar('<b>No llegaron golpes que contar.</b> ¿La ganancia está arriba? ¿Es la entrada ' +
      'correcta? Puedes revisarla en <a href="entradas" target="_blank">entradas</a>.', true);
    const acc = document.createElement('div');
    acc.className = 'acciones';
    acc.innerHTML = '<button class="btn" id="reCal">Reintentar</button>' +
      '<button class="btn plano" id="sinCal">Seguir sin calibrar</button>';
    pantalla.appendChild(acc);
    $('#reCal').onclick = pantallaCalibrar;
    $('#sinCal').onclick = () => {
      // Sin calibrar los numeros de ritmo llevan el desfase del sistema
      // adentro; queda marcado como dudoso para no fingir precision.
      bit = { ...bit, calibracion: { offset: 0, fecha: hoy(), dudosa: true } };
      guardarBit(bit);
      siguienteEjercicio();
    };
  }), 45000);

  alVentana = (v) => {
    for (const t of v.ataques) {
      let mejor = null, dist = Infinity;
      for (const c of met.clics) {
        const d = t - c;
        if (Math.abs(d) < dist) { dist = Math.abs(d); mejor = d; }
      }
      if (mejor === null || Math.abs(mejor) > met.paso / 2) continue;
      crudos.push(mejor * 1000);
      $('#cuenta').textContent = Math.max(0, OBJETIVO - crudos.length);
      /* Los dos primeros golpes se tiran: son de agarrar el paso. */
      const orden = crudos.length >= 3 ? crudos.slice(2).sort((a, b) => a - b) : null;
      if (orden) $('#dMed').textContent = orden[orden.length >> 1].toFixed(0) + ' ms';
      if (crudos.length >= OBJETIVO) {
        clearTimeout(rendirse);
        desmontar();
        const mediana = orden[orden.length >> 1];
        const ancho = orden[Math.floor(orden.length * 0.75)] - orden[Math.floor(orden.length * 0.25)];
        $('#dEst').textContent = '±' + (ancho / 2).toFixed(0) + ' ms';
        if (ancho > 90) {
          avisar('<b>Salió inestable (±' + (ancho / 2).toFixed(0) + ' ms).</b> Otra vez — ' +
            'pega la nota AL clic, sin adornarla.', true);
          setTimeout(vigente(pantallaCalibrar), 1600);
          return;
        }
        bit = { ...bit, calibracion: { offset: mediana, fecha: hoy() } };
        guardarBit(bit);
        setTimeout(vigente(siguienteEjercicio), 900);
      }
    }
  };
}

function siguienteEjercicio() {
  avisar('');
  if (modoSuelto) {
    if (pasoN > 0) { pantallaResumen(); return; }
    pasoN = 1; pasoTotal = 1;
    correr(modoSuelto);
    return;
  }
  if (!cola.length) { pantallaResumen(); return; }
  pasoN++;
  correr(cola.shift());
}

function correr(e) {
  epoca++; desmontar();
  alVentana = null;
  const corredor = {
    desviacion_ms: correrRitmo,
    cents: correrAfinar,
    tiempo_ms: correrEncontrar,
    acierto_pct: correrQuiz,
    ninguna: correrJam
  }[e.mide];
  /* Sin corredor no hay medicion, y sin medicion NO se escribe bitacora: un
     "reprobado" por falta de motor seria un numero falso con cara de real. */
  if (!corredor || (e.mide !== 'ninguna' && MEDIDAS_LISTAS.indexOf(e.mide) === -1)) {
    pantalla.innerHTML =
      '<div class="veredicto-caja"><p class="sub" style="margin-bottom:8px">' + e.nombre + '</p>' +
      '<div class="gigante" style="font-size:clamp(34px,7vw,60px)">aún sin motor</div>' +
      '<p class="contra">mide «' + e.mide + '», que pide oído de acordes (nivel 3). ' +
      'No se registra nada.</p>' +
      '<div class="acciones" style="justify-content:center">' +
      '<button class="btn" id="sigue">Seguir</button></div></div>';
    $('#sigue').onclick = siguienteEjercicio;
    teclas({ espacio: siguienteEjercicio });
    return;
  }
  corredor(e);
}

function cabecera(e, extra) {
  return '<div class="ej-cab"><span class="paso">' + pasoN + ' / ' + pasoTotal + ' · ' +
    e.bloque + '</span><h1 style="margin:0;font-size:clamp(20px,3.4vw,30px)">' + e.nombre +
    '</h1>' + (extra || '') + '</div>' +
    '<p class="dice">' + e.dice + '</p>' +
    '<div class="tempo-linea"><i id="tLinea"></i></div>';
}

function barraTiempo(dur, alTerminar) {
  const t0 = ctx.currentTime, e = epoca;
  const timer = setInterval(() => {
    if (e !== epoca) { clearInterval(timer); return; }   // pantalla muerta
    const k = (ctx.currentTime - t0) / dur;
    const linea = $('#tLinea');
    if (linea) linea.style.width = Math.min(100, k * 100) + '%';
    if (k >= 1) { clearInterval(timer); alTerminar(); }
  }, 200);
  return () => clearInterval(timer);
}

/* ── corredor: ritmo (desviacion_ms) ──────────────────────────────────── */
function correrRitmo(e) {
  teclas({});
  quiereAltura = false;
  const bpm = bpmPara(bit, e) || 70;
  const offset = (bit.calibracion ? bit.calibracion.offset : 0) / 1000;
  pantalla.innerHTML = cabecera(e, '<span class="det" style="font-family:var(--mono);font-size:11px;color:var(--tenue)">' + bpm + ' bpm</span>') +
    '<div class="gigante" id="dev">—<small> ms</small></div>' +
    '<div class="metricas">' +
    '<div><span>media</span><b id="media">—</b></div>' +
    '<div><span>golpes</span><b id="golpes">0</b></div>' +
    '<div><span>pulso</span><b><span class="pulso" id="pulso"></span></b></div></div>';

  const met = crearMetronomo(bpm, e.ficha.compas || 4);
  const devs = [];
  const pulsoTimer = setInterval(() => {
    // Solo los dos ultimos clics pueden estar "sonando ahora".
    const u = met.clics[met.clics.length - 1], v = met.clics[met.clics.length - 2];
    const enClic = (u !== undefined && Math.abs(ctx.currentTime - u) < 0.07) ||
                   (v !== undefined && Math.abs(ctx.currentTime - v) < 0.07);
    $('#pulso') && $('#pulso').classList.toggle('va', enClic);
  }, 40);
  armar(() => { met.parar(); clearInterval(pulsoTimer); alVentana = null; });

  alVentana = (v) => {
    for (const t of v.ataques) {
      let mejor = null, dist = Infinity;
      for (const c of met.clics) {
        const d = t - c - offset;
        if (Math.abs(d) < dist) { dist = Math.abs(d); mejor = d; }
      }
      if (mejor === null || Math.abs(mejor) > met.paso / 2) continue;
      const ms = mejor * 1000;
      devs.push(Math.abs(ms));
      const el = $('#dev');
      if (el) {
        el.innerHTML = (Math.abs(ms) < 12 ? '¡clavado!' :
          (ms > 0 ? '+' + ms.toFixed(0) + '<small> ms tarde</small>'
                  : ms.toFixed(0) + '<small> ms antes</small>'));
        el.className = 'gigante ' + (Math.abs(ms) <= e.aprobar ? 'bien' : (Math.abs(ms) > e.aprobar * 2 ? 'mal' : ''));
      }
      const media = devs.reduce((a, b) => a + b, 0) / devs.length;
      $('#media') && ($('#media').textContent = media.toFixed(0) + ' ms');
      $('#golpes') && ($('#golpes').textContent = devs.length);
    }
  };

  barraTiempo(e.duracion_s, () => {
    desmontar();
    const esperados = Math.floor(e.duracion_s * bpm / 60);
    if (devs.length < esperados * 0.4) {
      registrarY(e, null, false, 'faltaron golpes: ' + devs.length + ' de ~' + esperados);
      return;
    }
    const media = devs.reduce((a, b) => a + b, 0) / devs.length;
    registrarY(e, media, media <= e.aprobar, media.toFixed(0) + ' ms de media contra ' + e.aprobar);
  });
}

/* ── corredor: afinar / igualar (cents) ───────────────────────────────── */
function correrAfinar(e) {
  quiereAltura = true;
  const esAfinar = e.id === 'oid-afinar';
  /* El catalogo es el producto y crece: un ejercicio de cents nuevo sin
     cuerdas o sin rango de trastes no debe tirar la sesion a media practica. */
  if (!esAfinar && (!e.ficha || !e.ficha.cuerdas || !e.ficha.trastes)) {
    registrarY(e, null, false, 'la ficha no trae cuerdas/trastes — revisar el catálogo');
    return;
  }
  const rng = rngDe(hoy() + e.id);
  const rondas = esAfinar
    ? (e.ficha.cuerdas || [6, 5, 4, 3, 2, 1]).map((c) => ({ nombre: c + '·' + nombreDeMidi(midiDeHz(CUERDA_HZ[c])).replace(/\d+/, ''), hz: CUERDA_HZ[c] }))
    : Array.from({ length: 5 }, () => notaAlAzar(e, rng));
  let ronda = 0;
  const logros = [];
  let racha = [];

  pantalla.innerHTML = cabecera(e) +
    '<div class="ej-cab"><h1 class="gigante" id="objetivo" style="font-size:clamp(40px,9vw,84px)"></h1></div>' +
    '<div class="gigante" id="lect" style="font-size:clamp(30px,7vw,60px)">—</div>' +
    '<div class="metricas">' +
    '<div><span>ronda</span><b id="ron">1 / ' + rondas.length + '</b></div>' +
    '<div><span>desviación</span><b id="des">—</b></div>' +
    (esAfinar ? '' : '<div><span>repetir tono</span><b><span class="tecla">R</span></b></div>') +
    '</div>';

  function anunciar() {
    racha = [];
    $('#objetivo').textContent = rondas[ronda].nombre;
    $('#ron').textContent = (ronda + 1) + ' / ' + rondas.length;
    if (!esAfinar) tono(rondas[ronda].hz, ctx.currentTime + 0.05, 1.4);
  }
  teclas({ r: () => { if (!esAfinar) tono(rondas[ronda].hz, ctx.currentTime + 0.05, 1.4); } });
  anunciar();

  alVentana = (v) => {
    if (!v.f) return;
    const dev = centsA(v.f, rondas[ronda].hz);
    if (Math.abs(dev) > 120) return;      // otra cuerda, no esta
    $('#lect').textContent = (dev >= 0 ? '+' : '') + dev.toFixed(1) + ' ¢';
    $('#lect').className = 'gigante ' + (Math.abs(dev) <= 8 ? 'bien' : '');
    racha.push(dev);
    if (racha.length > 8) racha.shift();
    if (racha.length === 8 && racha.every((d) => Math.abs(d) <= 15)) {
      const media = Math.abs(racha.reduce((a, b) => a + b, 0) / racha.length);
      logros.push(media);
      $('#des').textContent = media.toFixed(1) + ' ¢';
      ronda++;
      if (ronda >= rondas.length) {
        alVentana = null; pararTiempo();
        const prom = logros.reduce((a, b) => a + b, 0) / logros.length;
        registrarY(e, prom, prom <= e.aprobar, prom.toFixed(1) + ' ¢ de media contra ' + e.aprobar);
      } else anunciar();
    }
  };

  const pararTiempo = barraTiempo(e.duracion_s, () => {
    alVentana = null;
    if (!logros.length) { registrarY(e, null, false, 'se acabó el tiempo sin fijar ninguna'); return; }
    const prom = logros.reduce((a, b) => a + b, 0) / logros.length;
    registrarY(e, prom, false, 'tiempo fuera: ' + logros.length + ' de ' + rondas.length + ' fijadas');
  });
}

/* ── corredor: encontrar la nota (tiempo_ms) ──────────────────────────── */
function correrEncontrar(e) {
  quiereAltura = true;
  const rng = rngDe(hoy() + e.id);
  const tiempos = [];
  let objetivo = null, tArranque = 0, seguidas = 0, esperando = false;

  pantalla.innerHTML = cabecera(e) +
    '<div class="ej-cab"><h1 class="gigante" id="objetivo" style="font-size:clamp(40px,9vw,84px)"></h1></div>' +
    '<div class="gigante" id="crono" style="font-size:clamp(30px,7vw,60px)">—</div>' +
    '<div class="metricas">' +
    '<div><span>encontradas</span><b id="hallas">0</b></div>' +
    '<div><span>mediana</span><b id="med">—</b></div>' +
    '<div><span>repetir tono</span><b><span class="tecla">R</span></b></div></div>';

  function siguiente() {
    objetivo = notaAlAzar(e, rng);
    $('#objetivo').textContent = objetivo.nombre;
    seguidas = 0; esperando = false;
    tono(objetivo.hz, ctx.currentTime + 0.05, 1.1);
    setTimeout(vigente(() => { tArranque = ctx.currentTime; esperando = true; }), 1200);
  }
  teclas({ r: () => tono(objetivo.hz, ctx.currentTime + 0.05, 1.1) });
  siguiente();

  const cronoTimer = setInterval(() => {
    if (esperando) $('#crono').textContent = ((ctx.currentTime - tArranque) * 1000).toFixed(0) + ' ms';
  }, 100);

  alVentana = (v) => {
    if (!esperando || !v.f) { if (v.f === 0) seguidas = 0; return; }
    if (Math.abs(centsA(v.f, objetivo.hz)) <= 35) {
      if (++seguidas >= 2) {
        const dt = (ctx.currentTime - tArranque) * 1000;
        tiempos.push(dt);
        $('#hallas').textContent = tiempos.length;
        const orden = tiempos.slice().sort((a, b) => a - b);
        $('#med').textContent = orden[orden.length >> 1].toFixed(0) + ' ms';
        esperando = false;
        setTimeout(vigente(siguiente), 900);
      }
    } else seguidas = 0;
  };

  barraTiempo(e.duracion_s, () => {
    clearInterval(cronoTimer); alVentana = null;
    if (tiempos.length < 3) { registrarY(e, null, false, 'muy pocas: ' + tiempos.length); return; }
    const orden = tiempos.slice().sort((a, b) => a - b);
    const med = orden[orden.length >> 1];
    registrarY(e, med, med <= e.aprobar, med.toFixed(0) + ' ms de mediana contra ' + e.aprobar);
  });
}

/* ── corredor: preguntas de oido (acierto_pct) ────────────────────────── */
function correrQuiz(e) {
  quiereAltura = false;
  const rng = rngDe(hoy() + e.id);
  const esTercera = e.id === 'oid-tercera';
  const RONDAS = 10;
  let ronda = 0, buenas = 0, correcta = null, listo = false;

  const op1 = esTercera ? 'alegre (mayor)' : 'sí, es la quinta';
  const op2 = esTercera ? 'triste (menor)' : 'no, es otra';

  pantalla.innerHTML = cabecera(e) +
    '<div class="gigante" id="marca" style="font-size:clamp(34px,8vw,70px)">escucha…</div>' +
    '<div class="opciones">' +
    '<button class="btn" id="op1"><span class="tecla">1</span>' + op1 + '</button>' +
    '<button class="btn" id="op2"><span class="tecla">2</span>' + op2 + '</button></div>' +
    '<div class="metricas">' +
    '<div><span>ronda</span><b id="ron">1 / ' + RONDAS + '</b></div>' +
    '<div><span>aciertos</span><b id="acs">0</b></div>' +
    '<div><span>repetir</span><b><span class="tecla">R</span></b></div></div>';

  let base = 0;
  function suena() {
    const t = ctx.currentTime + 0.08;
    if (esTercera) {
      const terceraST = correcta === 1 ? 4 : 3;
      tono(base, t, 1.5, 0.09);
      tono(base * Math.pow(2, terceraST / 12), t + 0.5, 1.0, 0.08);
      tono(base * Math.pow(2, 7 / 12), t + 0.5, 1.0, 0.06);
    } else {
      const salto = correcta === 1 ? 7 : (rng() < 0.5 ? 5 : 12);
      tono(base, t, 0.8, 0.1);
      tono(base * Math.pow(2, salto / 12), t + 0.85, 0.8, 0.1);
      tono(base, t + 1.8, 0.7, 0.08);
      tono(base * Math.pow(2, salto / 12), t + 1.8, 0.7, 0.08);
    }
  }
  function pregunta() {
    correcta = rng() < 0.5 ? 1 : 2;
    base = hzDeMidi(40 + Math.floor(rng() * 17));   // Mi2 a La3
    $('#marca').textContent = 'escucha…';
    $('#marca').className = 'gigante';
    $('#ron').textContent = (ronda + 1) + ' / ' + RONDAS;
    listo = true;
    suena();
  }
  function contesta(cual) {
    if (!listo) return;
    listo = false;
    const bien = cual === correcta;
    if (bien) buenas++;
    $('#acs').textContent = buenas;
    $('#marca').textContent = bien ? 'bien' : (esTercera ? (correcta === 1 ? 'era alegre' : 'era triste')
                                                         : (correcta === 1 ? 'sí era' : 'no era'));
    $('#marca').className = 'gigante ' + (bien ? 'bien' : 'mal');
    ronda++;
    if (ronda >= RONDAS) {
      pararTiempo(); alVentana = null; document.onkeydown = null;
      const pct = buenas / RONDAS * 100;
      setTimeout(() => registrarY(e, pct, pct >= e.aprobar, buenas + ' de ' + RONDAS + ' contra ' + e.aprobar + '%'), 900);
    } else setTimeout(vigente(pregunta), 1100);
  }
  $('#op1').onclick = () => contesta(1);
  $('#op2').onclick = () => contesta(2);
  teclas({ 1: () => contesta(1), 2: () => contesta(2), r: suena });

  const pararTiempo = barraTiempo(e.duracion_s + 30, () => {
    document.onkeydown = null;
    const pct = ronda ? buenas / ronda * 100 : 0;
    registrarY(e, pct, false, 'tiempo fuera en la ronda ' + (ronda + 1));
  });
  pregunta();
}

/* ── corredor: el jam (ninguna) ───────────────────────────────────────── */
function correrJam(e) {
  teclas({});
  quiereAltura = false;
  const ton = (sesion && sesion.tonalidad) || 'Em';
  const m = ton.match(/^([A-G][#b]?)(m?)/) || ['', 'E', 'm'];
  const IDX = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6,
    Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
  // `in` y no `||`: IDX['C'] es 0, y `0 || 4` mandaba todo Do a Mi.
  const raiz = 40 + (((m[1] in IDX ? IDX[m[1]] : 4)) + 12 - 4) % 12;   // cerca del Mi grave
  const menor = m[2] === 'm';
  /* la vuelta clasica de cada modo: cuatro acordes que no fallan */
  const grados = menor ? [[0, 3, 7], [8, 0, 3], [3, 7, 10], [10, 2, 5]]
                       : [[0, 4, 7], [7, 11, 2], [9, 0, 4], [5, 9, 0]];
  pantalla.innerHTML = cabecera(e) +
    '<div class="gigante" id="ton" style="font-size:clamp(40px,9vw,84px)">' + ton + '</div>' +
    '<p class="dice">No se mide nada. No hay nota. Es el premio.</p>';

  let acorde = 0, vivo = true;
  armar(() => { vivo = false; });
  const miEpoca = epoca;
  function pad() {
    if (!vivo || miEpoca !== epoca) return;
    const t = ctx.currentTime + 0.05;
    for (const semi of grados[acorde % grados.length]) {
      const hz = hzDeMidi(raiz + 12 + ((semi + raiz) % 12 >= (raiz % 12) ? semi : semi + 12));
      tono(hz, t, 4.4, 0.035);
      tono(hz * 2, t, 4.4, 0.015);
    }
    acorde++;
    setTimeout(pad, 4000);
  }
  pad();
  barraTiempo(e.duracion_s, () => {
    desmontar();
    registrarY(e, null, true, 'jam en ' + ton);
  });
}

/* ── veredicto y cierre ───────────────────────────────────────────────── */
function registrarY(e, valor, aprobado, contra) {
  epoca++; desmontar();
  document.onkeydown = null;
  quiereAltura = false;
  const sentido = CAT.medidas[e.mide] ? CAT.medidas[e.mide].sentido : 'sube';
  if (e.mide !== 'ninguna') {
    resultados.push({ id: e.id, valor, aprobado });
    bit = registrar(bit, e.id, { aprobado, valor, sentido, fecha: hoy() });
    guardarBit(bit);
  }
  const unidad = CAT.medidas[e.mide] ? CAT.medidas[e.mide].unidad : '';
  pantalla.innerHTML =
    '<div class="veredicto-caja">' +
    '<p class="sub" style="margin-bottom:8px">' + e.nombre + '</p>' +
    '<div class="gigante" style="font-size:clamp(44px,10vw,90px)">' +
    (valor === null ? '—' : (Math.round(valor * 10) / 10)) + '</div>' +
    '<p class="contra">' + (contra || unidad) + '</p>' +
    (e.mide === 'ninguna' ? '' :
      '<span class="sello ' + (aprobado ? 'si' : 'no') + '">' +
      (aprobado ? 'aprobado' : 'queda para mañana') + '</span>') +
    '<div class="acciones" style="justify-content:center">' +
    '<button class="btn" id="sigue">' + (cola.length ? 'Siguiente' : 'Ver el resumen') + '</button></div></div>';
  $('#sigue').onclick = siguienteEjercicio;
  teclas({ espacio: siguienteEjercicio });
}

function pantallaResumen() {
  epoca++; desmontar();
  document.onkeydown = null;
  alVentana = null;
  soltarMicrofono();
  if (!modoSuelto && sesion) {
    bit = cerrarSesion(bit, sesion, resultados, hoy());
    guardarBit(bit);
  }
  const filas = resultados.map((r) => {
    const e = POR_ID.get(r.id);
    return '<tr><td>' + e.nombre + '</td><td>' + (r.valor === null ? '—' : Math.round(r.valor * 10) / 10) +
      '</td><td class="' + (r.aprobado ? 'si' : 'no') + '">' +
      (r.aprobado ? 'aprobado' : 'mañana') + '</td></tr>';
  }).join('');
  /* que se abrio hoy: lo que ahora esta desbloqueado y ayer no */
  const abiertos = CAT.ejercicios.filter((e) =>
    resultados.some((r) => r.aprobado && e.requiere.includes(r.id)) &&
    desbloqueado(bit, e)
  ).map((e) => e.nombre);

  pantalla.innerHTML =
    '<h1>' + (modoSuelto ? 'Listo' : 'Sesión terminada') + '</h1>' +
    '<p class="sub">' + hoy() + (sesion && sesion.bloque ? ' · bloque: ' + sesion.bloque : '') + '</p>' +
    (filas ? '<table class="resumen"><tr><th>ejercicio</th><th>resultado</th><th>veredicto</th></tr>' +
      filas + '</table>' : '<p class="dice">Hoy no se midió nada — pero se tocó, y eso también cuenta.</p>') +
    (abiertos.length ? '<p class="nota-mini"><b>Se abrió:</b> ' + abiertos.join(' · ') + '</p>' : '') +
    '<div class="acciones"><button class="btn" id="otraVez">Al plan de mañana</button></div>';
  $('#otraVez').onclick = () => { resultados = []; cola = []; pasoN = 0; modoSuelto = null; pantallaPlan(); };
}

/* ── arranque ─────────────────────────────────────────────────────────── */
const params = new URLSearchParams(location.search);
const sueltoId = params.get('ej');
if (sueltoId && POR_ID.has(sueltoId) &&
    (POR_ID.get(sueltoId).mide === 'ninguna' ||
     MEDIDAS_LISTAS.indexOf(POR_ID.get(sueltoId).mide) !== -1)) {
  /* practicar suelto: ?ej=<id> corre un solo ejercicio, sin plan. Util para
     repetir el que quedo para mañana sin esperar a mañana. */
  modoSuelto = POR_ID.get(sueltoId);
  pasoN = 0; pasoTotal = 1;
  sesion = elegirSesion(CAT, bit, hoy());   // para la tonalidad del jam
  pantallaEntrada();
} else {
  pantallaPlan();
}
</script>
