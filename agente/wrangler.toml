name = "daniel-agente"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Los orígenes permitidos YA NO VIVEN AQUÍ. Ahora cada empresa declara los
# suyos en su ficha (src/clientes/*.js), porque el origen es también lo que
# decide de quién es la petición: tenerlos en una lista plana hacía imposible
# saber a qué cliente cobrarle el turno.

# Contador de uso para los topes diarios. Creado con:
#   npx wrangler kv namespace create CUOTA
[[kv_namespaces]]
binding = "CUOTA"
id = "217a5a72b7474dd48fa8305d7f171b74"

# Donde vive la conversación. Sin esto el agente contesta 503 a propósito:
# la alternativa —aceptar el historial que manda el navegador— es el agujero
# que este molde vino a cerrar.
#
#   npx wrangler d1 create conversaciones
#   npx wrangler d1 execute conversaciones --remote --file=esquema.sql
#
# Pega abajo el database_id que imprime el primer comando.
[[d1_databases]]
binding = "DB"
database_name = "conversaciones"
database_id = "84109f01-e301-4f91-aee5-7fe55eb70b4e"

# El verificador. Todos los días a las 9:00 UTC (3:00 en Monterrey). Sólo te
# escribe si encontró algo — un parte diario de "todo bien" se vuelve ruido y
# dejas de leerlo.
[triggers]
crons = ["0 9 * * *"]

# Secretos (NO van aquí — se ponen con `npx wrangler secret put NOMBRE`):
#
#   DEEPSEEK_API_KEY    la llave de platform.deepseek.com
#   BANDEJA_TOKEN       lo que te pide /bandeja para dejarte leer. Genera uno
#                       largo y al azar; es la única puerta a conversaciones
#                       de gente real.
#   TELEGRAM_TOKEN      el token del bot que te avisa de cada lead
#   TELEGRAM_CHAT_ID    tu chat con ese bot (número, puede ser negativo)
#
# Por cliente — el de Daniel va sin prefijo porque su worker ya está desplegado
# con esos nombres. Toda empresa nueva los prefija (ACME_CAL_URL, etc.) y lo
# declara en su ficha:
#
#   WHATSAPP_E164       su número en formato E.164 sin +, ej. 528112345678
#   CAL_URL             su página de reservas
#   KAPSO_NUMERO_ID     el phone_number_id del número de WhatsApp Business en
#                       Kapso. NO es el teléfono: es el id que Meta le da al
#                       número, y es lo que trae el webhook para decir a quién
#                       le escribieron.
#
# El canal de WhatsApp además necesita dos secretos del proyecto de Kapso, que
# NO son por cliente porque son de la cuenta:
#
#   KAPSO_API_KEY       la llave del proyecto (Project Settings > API Keys).
#                       Con ella se contesta.
#   KAPSO_WEBHOOK_SECRET  el secreto que Kapso genera al crear el webhook. Es
#                       la ÚNICA puerta de /whatsapp: un webhook no manda
#                       cabecera Origin, así que el control de origen —que
#                       protege todo lo demás— no aplica ahí.
#
# Sin los tres, /whatsapp contesta 503 y no gasta nada. Es la postura correcta:
# un endpoint público que llama al modelo sin puerta es una llave a tu tarjeta.
#
# Los dos de Telegram son opcionales: sin ellos el agente funciona igual, y el
# aviso queda escrito en la base con entregado = 0 para que lo veas en la
# bandeja. El BANDEJA_TOKEN no es opcional si quieres leer las conversaciones.

# El telefono (agente/src/telefono.js). La voz la pone Twilio: Amazon Mia
# generativa es mujer, mexicana y natural. Los secretos van aparte:
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM (el numero, +1... o +52...)
#   TEL_RELAY_TOKEN (aleatorio; viaja solo dentro del TwiML firmado)
[vars]
TEL_TTS = "Amazon"
TEL_VOZ = "Mia-Generative"
MODELO_VOZ = "deepseek-v4-flash"
